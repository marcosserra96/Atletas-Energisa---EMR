<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal dos Atletas Energisa ⚡️</title>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css" />
</head>

<body>
  <div id="toastContainer"></div>

  <div class="container">
    <div class="logo">
      <img src="assets/logo-energisa-branca.svg" alt="Energisa Logo" />
      <h1>Portal dos Atletas Energisa</h1>
    </div>

    <div class="login-box">
      <h2>Acesse sua conta</h2>
      <input type="email" id="email" placeholder="E-mail" required />
      <input type="password" id="password" placeholder="Senha" required />
      
      <button id="loginBtn">Entrar</button>

      <p class="register-text">
        Ainda não tem conta? <a href="#" id="showRegister">Crie agora</a>
      </p>
    </div>
  </div>

  <div id="registerModal" class="modal">
    <div class="modal-content">
      <span id="closeModal">&times;</span>
      <h2>Criar Conta</h2>

      <input type="text" id="nameRegister" placeholder="Nome completo" required />
      <input type="email" id="emailRegister" placeholder="E-mail" required />
      <input type="password" id="passwordRegister" placeholder="Senha" required />

      <div class="team-options">
        <label>Escolha seu grupo:</label>
        <div class="team-buttons">
          <button class="team-btn" data-value="bike">🚴 Bike</button>
          <button class="team-btn" data-value="corrida">🏃 Corrida</button>
          <button class="team-btn" data-value="comite">📋 Comitê</button>
        </div>
      </div>

      <input type="hidden" id="teamRegister" />
      <button id="registerBtn">Cadastrar</button>
      <p id="registerMessage"></p>
    </div>
  </div>

  <script type="module" src="js/auth.js" defer></script>

  <script>
    // Remove seleção ao abrir modal e gerencia a troca de botões
    document.addEventListener("DOMContentLoaded", () => {
      const showRegisterBtn = document.getElementById("showRegister");
      const modal = document.getElementById("registerModal");
      const teamButtons = document.querySelectorAll(".team-btn");
      const teamRegister = document.getElementById("teamRegister");
      const closeModal = document.getElementById("closeModal");

      // Abrir Modal
      showRegisterBtn.addEventListener("click", (e) => {
        e.preventDefault(); // Evita scroll topo
        modal.style.display = "flex";
        teamButtons.forEach(btn => btn.classList.remove("active"));
        teamRegister.value = "";
      });

      // Fechar Modal
      closeModal.addEventListener("click", () => {
        modal.style.display = "none";
      });

      // Fechar ao clicar fora do modal
      window.addEventListener("click", (e) => {
        if (e.target == modal) {
          modal.style.display = "none";
        }
      });

      // Lógica de Seleção de Time
      teamButtons.forEach(btn => {
        btn.addEventListener("click", () => {
          teamButtons.forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          teamRegister.value = btn.getAttribute("data-value");
        });
      });
    });
  </script>
</body>
</html>
